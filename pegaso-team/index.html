<!DOCTYPE html>
<html lang="pt-BR" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pégaso Team - Muay Thai, Jiu Jitsu e MMA | Poços de Caldas</title>
  <meta name="description" content="Centro de Treinamento de Muay Thai, Jiu Jitsu e MMA em Poços de Caldas - MG. Treine com o professor Arthur Thai na Pégaso Team." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { brand: { dark: '#101113', card: '#1B1D21', red: '#E53935', 'red-hover': '#C62828', gray: '#A8ADB7', green: '#22C55E' } },
        fontFamily: { heading: ['Barlow Condensed', 'sans-serif'], body: ['Manrope', 'sans-serif'] }
      }}
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Manrope', sans-serif; background-color: #101113; color: #fff; }
    h1,h2,h3,h4,.font-heading { font-family: 'Barlow Condensed',sans-serif; text-transform: uppercase; letter-spacing: .03em; }
  </style>
</head>
<body class="bg-brand-dark text-white selection:bg-brand-red selection:text-white">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const ACADEMY_INFO={
 name:"Pégaso Team",tagline:"Centro de treinamento de Muay Thai, Jiu Jitsu e MMA",
 address:"Rua Peru, 71 - Andar Superior, Poços de Caldas - MG, 37701-231",
 phone:"(35) 98473-6363",
 whatsappUrl:"https://wa.me/5535984736363?text=Ol%C3%A1!%20Gostaria%20de%20agendar%20uma%20aula%20experimental%20na%20P%C3%A9gaso%20Team.",
 instagram:"@pegasoteam",instagramUrl:"https://instagram.com/pegasoteam",headCoach:"Arthur Thai",
 images:{logo:"https://pegasoteam.netlify.app/51752.jpg",coach:"https://pegasoteam.netlify.app/51758.jpg",team:"https://pegasoteam.netlify.app/52331.jpg"}
};
const MODALITIES=[
 {id:"muay-thai",name:"Muay Thai",description:"A tradicional arte das 8 armas. Desenvolva condicionamento físico e aprenda socos, chutes, joelhadas e cotoveladas.",level:"Todos os níveis",duration:"60 min",coach:ACADEMY_INFO.headCoach,image:ACADEMY_INFO.images.coach},
 {id:"jiu-jitsu",name:"Jiu Jitsu",description:"Arte suave focada em controle de solo, alavancas e finalizações, disciplina e defesa pessoal.",level:"Iniciante ao avançado",duration:"75 min",coach:ACADEMY_INFO.headCoach,image:ACADEMY_INFO.images.team},
 {id:"mma",name:"MMA",description:"Integração de combate em pé e no chão para quem busca evolução técnica e condicionamento.",level:"Consulte os níveis",duration:"90 min",coach:ACADEMY_INFO.headCoach,image:ACADEMY_INFO.images.coach}
];
const PLANS=[
 {id:"mensal",name:"Plano Mensal",price:"150",period:"por mês",badge:"Flexível",features:["Acesso às modalidades","Aulas com o Prof. Arthur Thai","Sem fidelidade nem taxa de cancelamento","Acompanhamento técnico inicial"]},
 {id:"trimestral",name:"Plano Trimestral",price:"135",period:"por mês",badge:"Plano em destaque",highlight:true,features:["Acesso às aulas semanais","Acompanhamento da evolução","Economia no ciclo","Sparring supervisionado"]},
 {id:"semestral",name:"Plano Semestral",price:"120",period:"por mês",badge:"Melhor valor",features:["Acesso a Muay Thai, Jiu Jitsu e MMA","Acompanhamento contínuo","Desconto na mensalidade","Prioridade em eventos e graduações"]}
];
const SCHEDULE=[
 {day:"Segunda, Quarta e Sexta",time:"07:00 - 08:00",modality:"Muay Thai"},
 {day:"Segunda, Quarta e Sexta",time:"18:30 - 19:45",modality:"Jiu Jitsu"},
 {day:"Segunda, Quarta e Sexta",time:"20:00 - 21:15",modality:"Muay Thai / Sparring"},
 {day:"Terça e Quinta",time:"17:30 - 18:30",modality:"Muay Thai Infantil / Iniciante"},
 {day:"Terça e Quinta",time:"19:00 - 20:30",modality:"MMA & Transição de Solo"},
 {day:"Sábado",time:"10:00 - 11:30",modality:"Treino Livre / Sparring Geral"}
].map(x=>({...x,coach:ACADEMY_INFO.headCoach}));
function App(){
 const [currentTab,setCurrentTab]=useState("inicio"),[mobileMenuOpen,setMobileMenuOpen]=useState(false);
 const [bookingForm,setBookingForm]=useState({name:"",phone:"",modality:"Muay Thai",preferredTime:"Noite"});
 const [bookingSubmitted,setBookingSubmitted]=useState(false);
 useEffect(()=>{if(window.lucide)window.lucide.createIcons()},[currentTab,mobileMenuOpen,bookingSubmitted]);
 const handleTabChange=tab=>{setCurrentTab(tab);setMobileMenuOpen(false);window.scrollTo({top:0,behavior:"smooth"})};
 const bookingMessage=()=>`Olá! Gostaria de agendar uma aula experimental na Pégaso Team.\nNome: ${bookingForm.name}\nTelefone: ${bookingForm.phone}\nModalidade: ${bookingForm.modality}\nPeríodo preferido: ${bookingForm.preferredTime}`;
 const bookingUrl=bookingForm.name.trim()&&bookingForm.phone.trim()?`https://wa.me/5535984736363?text=${encodeURIComponent(bookingMessage())}`:ACADEMY_INFO.whatsappUrl;
 const navItems=[["inicio","Início"],["sobre","A Academia"],["modalidades","Modalidades"],["horarios","Horários"],["planos","Planos"],["contato","Contato"]];
 const wa=(label="Falar no WhatsApp",url=ACADEMY_INFO.whatsappUrl,classes="")=><a href={url} target="_blank" rel="noreferrer" className={classes}>{label}</a>;
 const SectionTitle=({title,subtitle})=><div className="text-center max-w-3xl mx-auto mb-12"><h1 className="text-4xl sm:text-5xl font-extrabold mb-4">{title}</h1><p className="text-brand-gray text-lg">{subtitle}</p></div>;
 return <div className="min-h-screen flex flex-col bg-brand-dark font-body text-white">
 <header className="sticky top-0 z-50 bg-brand-dark/95 backdrop-blur border-b border-white/10"><div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-20 flex items-center justify-between gap-4">
 <button className="flex items-center gap-3 text-left" onClick={()=>handleTabChange("inicio")}><img src={ACADEMY_INFO.images.logo} alt="Logo Pégaso Team" className="h-12 w-12 object-contain rounded-full border border-brand-red/50" onError={e=>e.currentTarget.style.display="none"}/><span><strong className="font-heading text-2xl font-extrabold tracking-wider block leading-none">PÉGASO TEAM</strong><small className="text-[10px] text-brand-gray tracking-widest uppercase">Poços de Caldas</small></span></button>
 <nav className="hidden lg:flex items-center gap-5 text-sm font-semibold text-brand-gray">{navItems.map(([id,label])=><button key={id} onClick={()=>handleTabChange(id)} className={currentTab===id?"text-brand-red font-bold":"hover:text-white"}>{label}</button>)}</nav>
 <div className="hidden sm:block">{wa(<><i data-lucide="message-square" className="w-4 h-4 inline mr-2"></i>Agendar treino</>,ACADEMY_INFO.whatsappUrl,"bg-brand-red hover:bg-brand-red-hover text-white font-bold px-4 py-3 rounded-lg text-sm uppercase")}</div>
 <button aria-label="Abrir menu" onClick={()=>setMobileMenuOpen(!mobileMenuOpen)} className="lg:hidden p-2 text-brand-gray"><i data-lucide={mobileMenuOpen?"x":"menu"} className="w-7 h-7"></i></button></div>
 {mobileMenuOpen&&<div className="lg:hidden bg-brand-card border-b border-white/10 px-4 pt-2 pb-6 space-y-2">{navItems.map(([id,label])=><button key={id} onClick={()=>handleTabChange(id)} className="block w-full text-left py-2 font-bold border-b border-white/5">{label}</button>)}{wa("Falar no WhatsApp",ACADEMY_INFO.whatsappUrl,"block w-full text-center bg-brand-red font-bold py-3 rounded-lg mt-4")}</div>}</header>
 <main className="flex-1">
 {currentTab==="inicio"&&<><section className="relative min-h-[75vh] flex items-center justify-center bg-cover bg-center" style={{backgroundImage:`linear-gradient(to bottom,rgba(16,17,19,.72),rgba(16,17,19,.98)),url("${ACADEMY_INFO.images.team}")`}}><div className="max-w-5xl mx-auto px-4 text-center py-20"><img src={ACADEMY_INFO.images.logo} alt="Logo Pégaso" className="w-32 h-32 mx-auto mb-6 object-contain" onError={e=>e.currentTarget.style.display="none"}/><span className="inline-block bg-brand-red/20 text-brand-red border border-brand-red/30 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest mb-4">Poços de Caldas - MG</span><h1 className="text-5xl sm:text-7xl lg:text-8xl font-extrabold mb-6 leading-none">TREINE COM PROPÓSITO.<br/><span className="text-brand-red">EVOLUA COM A EQUIPE.</span></h1><p className="text-lg sm:text-xl text-brand-gray max-w-2xl mx-auto mb-10">{ACADEMY_INFO.tagline}. Aulas sob o comando do professor <strong className="text-white">{ACADEMY_INFO.headCoach}</strong>.</p><div className="flex flex-col sm:flex-row gap-4 justify-center">{wa(<><i data-lucide="calendar" className="w-5 h-5 inline mr-2"></i>Agendar aula experimental</>,ACADEMY_INFO.whatsappUrl,"bg-brand-red hover:bg-brand-red-hover font-bold px-6 py-4 rounded-xl uppercase") }<button onClick={()=>handleTabChange("modalidades")} className="border border-white/20 bg-white/5 font-bold px-6 py-4 rounded-xl uppercase">Conhecer modalidades</button></div></div></section>
 <section className="py-16 bg-brand-card border-t border-white/10"><div className="max-w-7xl mx-auto px-4"><SectionTitle title="Modalidades oferecidas" subtitle="Encontre seu caminho na Pégaso Team: técnica, disciplina e evolução."/><div className="grid md:grid-cols-3 gap-8">{MODALITIES.map(mod=><article key={mod.id} className="bg-brand-dark rounded-2xl overflow-hidden border border-white/10 flex flex-col"><img src={mod.image} alt={mod.name} className="h-56 w-full object-cover"/><div className="p-6 flex-1"><span className="text-brand-red text-xs font-bold">{mod.duration}</span><h2 className="text-3xl font-bold my-2">{mod.name}</h2><p className="text-brand-gray text-sm leading-relaxed">{mod.description}</p><p className="text-sm mt-4">Professor: <strong>{mod.coach}</strong></p><button onClick={()=>handleTabChange("agendar")} className="mt-4 text-brand-red font-bold uppercase">Agendar →</button></div></article>)}</div></div></section>
 <section className="py-16 max-w-7xl mx-auto px-4 grid lg:grid-cols-2 gap-10 items-center"><img src={ACADEMY_INFO.images.coach} alt="Professor Arthur Thai" className="w-full h-[420px] object-cover rounded-2xl" onError={e=>e.currentTarget.style.display="none"}/><div><span className="text-brand-red font-bold uppercase">Corpo técnico</span><h2 className="text-4xl sm:text-5xl font-extrabold my-4">TREINE COM QUEM ENTENDE DA LUTA</h2><p className="text-brand-gray text-lg leading-relaxed mb-6">Na Pégaso Team, o professor {ACADEMY_INFO.headCoach} acompanha os alunos com foco em técnica, segurança e evolução respeitando os limites de cada um.</p>{wa("Falar com o professor",ACADEMY_INFO.whatsappUrl,"inline-block bg-brand-red font-bold px-6 py-3 rounded-xl uppercase")}</div></section>
 <section className="py-16 bg-brand-card"><div className="max-w-7xl mx-auto px-4 grid lg:grid-cols-2 gap-10 items-center"><div><h2 className="text-4xl font-extrabold mb-6">VENHA NOS VISITAR</h2><p className="text-brand-gray mb-3"><strong className="text-white">Endereço:</strong> {ACADEMY_INFO.address}</p><p className="text-brand-gray mb-3"><strong className="text-white">Telefone:</strong> {ACADEMY_INFO.phone}</p><p className="mb-6"><strong>Instagram:</strong> <a className="text-brand-red" href={ACADEMY_INFO.instagramUrl} target="_blank" rel="noreferrer">{ACADEMY_INFO.instagram}</a></p>{wa("Chamar no WhatsApp",ACADEMY_INFO.whatsappUrl,"inline-block bg-brand-red font-bold px-6 py-3 rounded-xl")}</div><iframe title="Mapa Pégaso Team" src="https://maps.google.com/maps?q=Rua%20Peru%2071%20Po%C3%A7os%20de%20Caldas%20MG&t=&z=15&ie=UTF8&iwloc=&output=embed" className="w-full h-80 rounded-xl border-0" loading="lazy"></iframe></div></section></>}
 {currentTab==="sobre"&&<section className="py-16 max-w-5xl mx-auto px-4"><SectionTitle title="Sobre a Pégaso Team" subtitle="Tradição, disciplina e foco no resultado em Poços de Caldas - MG."/><img src={ACADEMY_INFO.images.team} alt="Equipe Pégaso Team" className="w-full h-[350px] object-cover rounded-2xl mb-8"/><div className="grid md:grid-cols-2 gap-8"><article className="bg-brand-card p-8 rounded-2xl"><h2 className="text-2xl font-bold mb-4">Nossa missão</h2><p className="text-brand-gray leading-relaxed">Proporcionar um ambiente seguro, motivador e técnico para pessoas de diferentes idades praticarem artes marciais, desenvolvendo saúde física, autodefesa e resiliência.</p></article><article className="bg-brand-card p-8 rounded-2xl"><h2 className="text-2xl font-bold mb-4">Liderança técnica</h2><p className="text-brand-gray leading-relaxed">Com o comando do professor {ACADEMY_INFO.headCoach}, a equipe valoriza o acompanhamento próximo e a evolução de cada aluno.</p></article></div></section>}
 {currentTab==="modalidades"&&<section className="py-16 max-w-7xl mx-auto px-4"><SectionTitle title="Modalidades de treino" subtitle="Conheça as modalidades oferecidas pela Pégaso Team."/><div className="grid md:grid-cols-3 gap-8">{MODALITIES.map(mod=><article key={mod.id} className="bg-brand-card p-6 rounded-2xl border border-white/10"><img src={mod.image} alt={mod.name} className="w-full h-52 object-cover rounded-xl mb-5"/><span className="text-xs font-bold text-brand-red uppercase">{mod.level}</span><h2 className="text-3xl font-bold mt-1 mb-3">{mod.name}</h2><p className="text-brand-gray text-sm leading-relaxed">{mod.description}</p><p className="mt-4 text-sm">Professor: <strong>{mod.coach}</strong></p>{wa("Agendar treino",ACADEMY_INFO.whatsappUrl,"mt-5 block text-center bg-brand-red py-3 rounded-xl font-bold uppercase")}</article>)}</div></section>}
 {currentTab==="horarios"&&<section className="py-16 max-w-5xl mx-auto px-4"><SectionTitle title="Grade de horários" subtitle="Confira a grade semanal de turmas da Pégaso Team."/><div className="bg-brand-card rounded-2xl border border-white/10 divide-y divide-white/10">{SCHEDULE.map((item,i)=><div key={i} className="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><span className="text-xs text-brand-red font-bold uppercase">{item.day}</span><h2 className="text-2xl font-bold">{item.modality}</h2><p className="text-sm text-brand-gray">Professor: {item.coach}</p></div><div className="flex items-center justify-between gap-4"><span className="bg-brand-dark px-4 py-2 rounded-lg text-sm font-mono border border-white/10">{item.time}</span>{wa("Reservar",ACADEMY_INFO.whatsappUrl,"bg-brand-red px-4 py-2 rounded-lg text-xs font-bold uppercase")}</div></div>)}</div></section>}
 {currentTab==="planos"&&<section className="py-16 max-w-7xl mx-auto px-4"><SectionTitle title="Planos de treinamento" subtitle="Consulte as opções para começar sua jornada na Pégaso Team."/><div className="grid md:grid-cols-3 gap-8">{PLANS.map(plan=><article key={plan.id} className={`bg-brand-card p-8 rounded-2xl border flex flex-col ${plan.highlight?"border-brand-red":"border-white/10"}`}><span className="text-center text-xs text-brand-red font-bold uppercase mb-4">{plan.badge}</span><h2 className="text-2xl font-bold text-center mb-4">{plan.name}</h2><div className="text-center mb-8"><span className="text-xs text-brand-gray">R$</span><span className="text-6xl font-black font-heading">{plan.price}</span><span className="block text-xs text-brand-gray">{plan.period}</span></div><ul className="space-y-4 mb-8 flex-1">{plan.features.map((f,i)=><li key={i} className="flex gap-3 text-sm text-brand-gray"><i data-lucide="check" className="w-5 h-5 text-brand-red shrink-0"></i>{f}</li>)}</ul>{wa("Matricular-se agora",ACADEMY_INFO.whatsappUrl,`block text-center py-4 rounded-xl font-bold uppercase ${plan.highlight?"bg-brand-red":"bg-brand-dark border border-white/20"}`)}</article>)}</div></section>}
 {currentTab==="agendar"&&<section className="py-16 max-w-xl mx-auto px-4"><div className="bg-brand-card p-8 rounded-2xl border border-white/10"><h1 className="text-4xl font-extrabold mb-2 text-center">Agendar aula experimental</h1><p className="text-brand-gray text-sm text-center mb-8">Preencha os dados e continue pelo WhatsApp para confirmar o horário.</p>{bookingSubmitted?<div className="text-center space-y-4"><i data-lucide="check-circle" className="w-12 h-12 text-brand-green mx-auto"></i><h2 className="text-2xl font-bold">Pronto para continuar!</h2><p className="text-brand-gray text-sm">Sua mensagem foi preparada. Envie pelo WhatsApp para solicitar a aula; o agendamento só fica confirmado após resposta da equipe.</p>{wa("Enviar solicitação pelo WhatsApp",bookingUrl,"block bg-brand-green font-bold py-4 rounded-xl uppercase")}</div>:<form onSubmit={e=>{e.preventDefault();setBookingSubmitted(true)}} className="space-y-4"><label className="block text-xs font-bold text-brand-gray uppercase">Nome completo<input required value={bookingForm.name} onChange={e=>setBookingForm({...bookingForm,name:e.target.value})} placeholder="Seu nome" className="mt-1 w-full bg-brand-dark border border-white/10 rounded-xl p-3.5 text-white normal-case"/></label><label className="block text-xs font-bold text-brand-gray uppercase">Telefone / WhatsApp<input required type="tel" value={bookingForm.phone} onChange={e=>setBookingForm({...bookingForm,phone:e.target.value})} placeholder="(35) 90000-0000" className="mt-1 w-full bg-brand-dark border border-white/10 rounded-xl p-3.5 text-white normal-case"/></label><label className="block text-xs font-bold text-brand-gray uppercase">Modalidade<select value={bookingForm.modality} onChange={e=>setBookingForm({...bookingForm,modality:e.target.value})} className="mt-1 w-full bg-brand-dark border border-white/10 rounded-xl p-3.5 text-white"><option>Muay Thai</option><option>Jiu Jitsu</option><option>MMA</option></select></label><label className="block text-xs font-bold text-brand-gray uppercase">Período preferido<select value={bookingForm.preferredTime} onChange={e=>setBookingForm({...bookingForm,preferredTime:e.target.value})} className="mt-1 w-full bg-brand-dark border border-white/10 rounded-xl p-3.5 text-white"><option>Manhã</option><option>Tarde</option><option>Noite</option></select></label><button type="submit" className="w-full bg-brand-red hover:bg-brand-red-hover font-bold py-4 rounded-xl uppercase mt-4">Continuar agendamento</button></form>}</div></section>}
 {currentTab==="contato"&&<section className="py-16 max-w-4xl mx-auto px-4"><SectionTitle title="Canais de contato" subtitle="Estamos prontos para atender você na Pégaso Team."/><div className="grid md:grid-cols-2 gap-8"><div className="bg-brand-card p-8 rounded-2xl border border-white/10 space-y-6"><div><h2 className="font-bold text-lg mb-1">Endereço completo</h2><p className="text-brand-gray text-sm">{ACADEMY_INFO.address}</p></div><div><h2 className="font-bold text-lg mb-1">Telefone & WhatsApp</h2><p className="text-brand-gray text-sm">{ACADEMY_INFO.phone}</p></div><div><h2 className="font-bold text-lg mb-1">Instagram oficial</h2><a href={ACADEMY_INFO.instagramUrl} target="_blank" rel="noreferrer" className="text-brand-red font-bold text-sm">{ACADEMY_INFO.instagram}</a></div>{wa("Mandar mensagem",ACADEMY_INFO.whatsappUrl,"block text-center bg-brand-red font-bold py-4 rounded-xl uppercase")}</div><iframe title="Mapa do CT" src="https://maps.google.com/maps?q=Rua%20Peru%2071%20Po%C3%A7os%20de%20Caldas%20MG&t=&z=15&ie=UTF8&iwloc=&output=embed" className="w-full h-80 rounded-xl border-0" loading="lazy"></iframe></div></section>}
 </main>
 <a href={ACADEMY_INFO.whatsappUrl} target="_blank" rel="noreferrer" title="Falar no WhatsApp" className="fixed bottom-6 right-6 z-50 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-2xl flex items-center justify-center border-2 border-white/20"><i data-lucide="message-circle" className="w-8 h-8"></i></a>
 <footer className="bg-brand-dark border-t border-white/10 py-10"><div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-5"><div className="flex items-center gap-3"><img src={ACADEMY_INFO.images.logo} alt="Logo Pégaso Team" className="w-10 h-10 object-contain rounded-full" onError={e=>e.currentTarget.style.display="none"}/><div><strong className="font-heading text-xl block">PÉGASO TEAM</strong><span className="text-[10px] text-brand-gray tracking-widest uppercase">Poços de Caldas - MG</span></div></div><div className="text-center md:text-right"><p className="text-xs text-brand-gray mb-1">{ACADEMY_INFO.address}</p><p className="text-xs text-brand-gray">© {new Date().getFullYear()} Pégaso Team. Todos os direitos reservados.</p></div></div></footer>
 </div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
